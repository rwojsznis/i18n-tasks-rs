name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR. A new push cancels the run that is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The doc comments carry the `ref:` citations and the intra-doc links
      # between them. `--document-private-items` is what makes that worth
      # running: nearly every documented item in this crate is private.
      - name: cargo doc
        run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links

      # Four dependencies were declared and never imported. `cargo clippy`
      # cannot see that, so this is what keeps the manifest honest.
      - name: cargo machete
        run: |
          # renovate: datasource=crate depName=cargo-machete
          cargo install --locked cargo-machete --version 0.9.2
          cargo machete

      # Vulnerabilities in the lock file fail the job; an unmaintained or
      # yanked crate is only printed, because `--deny warnings` would turn a
      # green main red without a change here.
      - name: cargo audit
        run: |
          # renovate: datasource=crate depName=cargo-audit
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo test
        run: cargo test --locked --all-targets

      # `Pattern::run`, `flatten` and the YAML reader all recurse, and a release
      # build has different stack headroom and no overflow checks.
      - name: cargo test --release
        run: cargo test --locked --release --all-targets

      - name: doc tests
        run: cargo test --locked --doc

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        run: |
          # renovate: datasource=crate depName=cargo-llvm-cov
          cargo install --locked cargo-llvm-cov --version 0.9.0

      - name: Generate coverage report
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
