name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR. A new push cancels the run that is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Four dependencies were declared and never imported. `cargo clippy`
      # cannot see that, so this is what keeps the manifest honest.
      - name: cargo machete
        run: |
          cargo install --locked cargo-machete
          cargo machete

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      # `Pattern::run`, `flatten` and the YAML reader all recurse, and a release
      # build has different stack headroom and no overflow checks.
      - name: cargo test --release
        run: cargo test --release --all-targets

      - name: doc tests
        run: cargo test --doc
