name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR. A new push cancels the run that is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # The doc comments carry the `ref:` citations and the intra-doc links
      # between them. `--document-private-items` is what makes that worth
      # running: nearly every documented item in this crate is private.
      - name: cargo doc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links

      # Four dependencies were declared and never imported. `cargo clippy`
      # cannot see that, so this is what keeps the manifest honest.
      - name: cargo machete
        run: |
          cargo install --locked cargo-machete
          cargo machete

      # Vulnerabilities in the lock file fail the job; an unmaintained or
      # yanked crate is only printed, because `--deny warnings` would turn a
      # green main red without a change here.
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo test
        run: cargo test --all-targets

      # `Pattern::run`, `flatten` and the YAML reader all recurse, and a release
      # build has different stack headroom and no overflow checks.
      - name: cargo test --release
        run: cargo test --release --all-targets

      - name: doc tests
        run: cargo test --doc
