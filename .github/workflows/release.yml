name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: i18n-tasks-rs-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: i18n-tasks-rs-aarch64-apple-darwin.tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: i18n-tasks-rs-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} i18n-tasks-rs

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading archives."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            echo "Release $TAG does not exist; creating it."
            gh release create "$TAG" dist/* --repo "$REPO" --generate-notes --verify-tag
          fi
