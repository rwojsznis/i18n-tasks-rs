[package]
name = "i18n-tasks-rs"
# Internal Cargo version. Release binaries get their version from the Git tag.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "A Rust port of the i18n-tasks gem: find missing and unused translations in a Rails project"
license = "MIT"
repository = "https://github.com/rwojsznis/i18n-tasks-rs"
publish = false
readme = "README.md"
keywords = ["i18n", "rails", "translations", "yaml"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aho-corasick = "1.1.5"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
rayon = "1.12.0"
regex = "1.13.1"
ruby-prism = "1.9.0"
saphyr-parser = "0.0.12"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
similar = { version = "3.2.0", features = ["text"] }

[lib]
name = "i18n_tasks_rs"
path = "src/lib.rs"

[[bin]]
name = "i18n-tasks-rs"
path = "src/main.rs"

# macOS's default `unpacked` leaves a .o per codegen unit that Cargo never deletes; `debug = 2` if a debugger needs more than line numbers.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Kept in the manifest rather than in the CI command line, so a local `cargo
# clippy` says the same thing CI does. The three panic-family restriction lints
# live in `src/lib.rs` and `src/main.rs` instead, because they are about the
# shipped code and the tests are full of `unwrap`.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Cosmetic, and each one loses an argument with this codebase's style.
doc_markdown = "allow"        # the gem's names are not Rust items
must_use_candidate = "allow"  # nothing here is a builder
# `write!` into a `String` cannot fail, so the alternative is an `unwrap` that
# `clippy::unwrap_used` in `src/lib.rs` then forbids. The reports are built by
# pushing.
format_push_string = "allow"
# clap needs one `bool` per flag, and every field is read by name.
struct_excessive_bools = "allow"
# A `match` on an enum stays a `match`: at all six sites the other arm is a
# block of several statements, and the suggested `if let ... else` is longer.
single_match_else = "allow"
# `init::detect`, `init::render` and `Config::parse` are long because each one
# is a single list of cases. Splitting them would only move the list.
too_many_lines = "allow"
# Kept on, unlike the pedantic lints allowed above: a silently truncated offset
# or length would corrupt a locale file, and `normalize --write` is the one code
# path in the tool that destroys data.
cast_possible_truncation = "warn"
